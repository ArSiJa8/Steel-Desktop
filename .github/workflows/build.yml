name: Build Steel-Desktop

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact_name: steel-desktop-windows
            bundles_path: src-tauri/target/release/bundle
          - platform: macos-latest
            artifact_name: steel-desktop-macos
            bundles_path: src-tauri/target/release/bundle
          - platform: ubuntu-22.04
            artifact_name: steel-desktop-linux
            bundles_path: src-tauri/target/release/bundle

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.bundles_path }}/msi/*.msi
            ${{ matrix.bundles_path }}/nsis/*.exe
            ${{ matrix.bundles_path }}/dmg/*.dmg
            ${{ matrix.bundles_path }}/macos/*.app
            ${{ matrix.bundles_path }}/deb/*.deb
            ${{ matrix.bundles_path }}/appimage/*.AppImage
            ${{ matrix.bundles_path }}/rpm/*.rpm
          if-no-files-found: warn
